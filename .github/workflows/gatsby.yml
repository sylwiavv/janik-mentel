name: Deploy Gatsby site to FTP

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build with Gatsby
        env:
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          GATSBY_FORMSPREE_FORM_ID: ${{ secrets.GATSBY_FORMSPREE_FORM_ID }}
          GATSBY_GOOGLE_MAP_KEY: ${{ secrets.GATSBY_GOOGLE_MAP_KEY }}
          GATSBY_GOOGLE_RECAPTCHA_SITE_KEY: ${{ secrets.GATSBY_GOOGLE_RECAPTCHA_SITE_KEY }}
        run: npm run build

      - name: Deploy to FTP
        uses: sebastianpopp/ftp-action@v2.0.0
        with:
          host: ${{ secrets.FTP_HOST }}
          user: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          localDir: public
          remoteDir: test
